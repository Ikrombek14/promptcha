# /etc/nginx/sites-available/promptcha.uz
# Certbot: certbot --nginx -d promptcha.uz -d www.promptcha.uz
#
# Xavfsizlik:
#  - API faqat shu server orqali: har /api/ soʻrovga maxfiy X-Internal-Key qoʻshiladi (FastAPI tekshiradi)
#  - /api/docs, /api/openapi.json prod'da yopiq
#  - limit_req: IP boʻyicha daqiqalik chegara (FastAPI'dagi slowapi'dan tashqari)
#  - HSTS va boshqa sarlavhalar
#  - Tana hajmi 64 KB (API), 2 MB (sayt)

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=web_zone:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
    listen 80;
    listen [::]:80;
    server_name promptcha.uz www.promptcha.uz;
    return 301 https://promptcha.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.promptcha.uz;
    ssl_certificate     /etc/letsencrypt/live/promptcha.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promptcha.uz/privkey.pem;
    return 301 https://promptcha.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name promptcha.uz;

    ssl_certificate     /etc/letsencrypt/live/promptcha.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/promptcha.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    limit_conn conn_zone 20;
    client_max_body_size 2m;

    # Prod'da hujjatlar yopiq
    location ~ ^/api/(docs|openapi\.json|redoc) {
        return 404;
    }

    # FastAPI — SSE uchun bufferlash oʻchirilgan
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        client_max_body_size 64k;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        # Maxfiy kalit — api/.env dagi INTERNAL_API_KEY bilan bir xil (tashqaridan kelgan sarlavha ustidan yoziladi)
        proxy_set_header   X-Internal-Key "CHANGE_ME_32_PLUS_RANDOM_CHARS";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 180s;
    }

    # Next.js
    location / {
        limit_req zone=web_zone burst=60 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
