[project]
name = "promptcha-api"
version = "0.1.0"
description = "Promptcha — oddiy soʻzdan tayyor AI prompt"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "anthropic>=1.5,<2",
    "sse-starlette>=3.0",
    "authlib>=1.6",
    "python-jose[cryptography]>=3.4",
    "slowapi>=0.1.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "google-genai>=2.23.0",
    "openai>=3.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
