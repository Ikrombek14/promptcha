# main ga push → serverga deploy (robbit-quiz uslubi: testsiz, faqat deploy + versiya tekshiruvi).
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (CI uchun alohida ed25519 kalit).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (169.58.130.201)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH kalit
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Heredoc tuzogʻi: skript STDIN orqali berilmaydi — serverdagi repo yangilanib, undagi skript chaqiriladi
      - name: Serverda deploy
        run: |
          ssh -n -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/promptcha/app && sudo -u promptcha git fetch -q origin main && sudo -u promptcha git reset -q --hard origin/main && bash scripts/ci-deploy.sh ${{ github.sha }}"

      - name: Serverdagi commit push qilinganiga mosmi
        run: |
          got=$(ssh -n -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "curl -s -m 10 http://127.0.0.1:8010/api/health")
          echo "$got"
          echo "$got" | grep -q "\"commit\": *\"${{ github.sha }}\"" || { echo "::error::Serverdagi commit mos emas"; exit 1; }
