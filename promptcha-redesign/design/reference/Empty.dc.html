<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Natija paneli — boʻsh holat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C10}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid #7AA2FF;outline-offset:2px}
.ex{transition:border-color .15s,background .15s,color .15s}
@media (hover:hover){.ex:hover{border-color:#4A5163 !important;color:#EDEEF2 !important;background:#1A1D25 !important}}
a{color:#7AA2FF}a:hover{color:#A9C2FF}
</style>
</helmet>
<div style="width: 760px; height: 640px; padding: 24px; background: #0B0C10; font-family: 'Manrope', system-ui, sans-serif; color: #EDEEF2">
<section aria-labelledby="e-h" style="height: 100%; background: #13151B; border: 1px solid #22262F; border-radius: 16px; padding: 28px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Tayyor prompt</h2>
<span style="height: 26px; padding: 0 10px; border-radius: 9999px; background: #171A21; border: 1px solid #262A35; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #9AA1B2"><span style="width: 6px; height: 6px; border-radius: 9999px; background: #4A5163"></span>Model tanlanmagan</span>
</div>
<div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 24px 40px">
<div style="width: 64px; height: 64px; border-radius: 18px; background: #1A1E2B; border: 1px solid #2B3245; display: flex; align-items: center; justify-content: center; color: #9DB8FF">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.13-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.13a.5.5 0 0 1 .96 0l1.58 6.13a2 2 0 0 0 1.44 1.44l6.13 1.58a.5.5 0 0 1 0 .96l-6.13 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0z"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 440px">
<h3 id="e-h" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.015em">Natija shu yerda paydo boʻladi</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #9AA1B2">Chap tomonda gʻoyangizni yozing yoki pastdagi namunalardan birini tanlab koʻring.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 520px; margin-top: 8px">
<sc-for list="{{examples}}" as="e" hint-placeholder-count="3">
<button type="button" class="ex" onClick="{{e.pick}}" aria-pressed="{{e.on}}" style="min-height: 52px; padding: 12px 16px; border: 1px solid; border-radius: 12px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 14px; font-weight: 600; {{e.style}}">
<span style="height: 24px; padding: 0 8px; border-radius: 6px; background: #1F2330; color: #9DB8FF; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; flex: 0 0 auto">{{e.tag}}</span>
<span style="flex: 1 1 0">{{e.text}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: center; gap: 20px; font-size: 13px; color: #7A8294">
<span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border: 1px solid #2A2F3A; border-radius: 5px; color: #A3AABA">Ctrl ↵</span> yaratish</span>
<span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 2px 6px; border: 1px solid #2A2F3A; border-radius: 5px; color: #A3AABA">/</span> gʻoya maydoni</span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var picked = (this.state || {}).picked;
    var ON = 'background:rgba(58,99,240,.14);border-color:#4C7DFF;color:#EDEEF2;';
    var OFF = 'background:#171A21;border-color:#262A35;color:#BFC4D0;';
    var items = [
      { id: 1, tag: 'Rasm', text: 'Yomgʻirli Toshkent koʻchasi, kechki chiroqlar' },
      { id: 2, tag: 'Video', text: 'Qoʻqon bozorida non yopayotgan novvoy, sekin kamera' },
      { id: 3, tag: 'Ilova', text: 'Oʻquvchilar uchun kunlik vazifa rejalashtiruvchi' }
    ];
    return {
      examples: items.map(function (e) {
        return { tag: e.tag, text: e.text, on: picked === e.id, style: picked === e.id ? ON : OFF, pick: function () { self.setState({ picked: e.id }); } };
      })
    };
  }
}
</script>
</body>
</html>
