<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Promptcha — mobil kredit olish</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C10}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid #7AA2FF;outline-offset:2px}
a{color:#EDEEF2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0C10; color: #EDEEF2; font-family: 'Manrope', system-ui, sans-serif">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 52px; display: flex; align-items: center; font-size: 20px; font-weight: 800; letter-spacing: -0.04em">Prompt<span style="color: #8C93A4">cha</span></div>
<div style="height: 64px; border-radius: 14px; background: #13151B; border: 1px solid #22262F"></div>
<div style="height: 220px; border-radius: 16px; background: #13151B; border: 1px solid #22262F"></div>
<div style="height: 150px; border-radius: 16px; background: #151A28; border: 1px solid #2E3754"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,9,0.72)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="mp-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #13151B; border-top: 1px solid #2A2F3A; border-radius: 22px 22px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #3A4050"></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="mp-h" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Promptni 90+ ga yetkazish</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #9AA1B2">Bir marta toʻlaysiz, kreditlar muddatsiz.</p>
</div>
<ul style="margin: 0; padding: 10px 12px; list-style: none; border-radius: 12px; background: #0E1015; border: 1px solid #232733; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D5D9E3">
<li style="display: flex; justify-content: space-between"><span>90+ ga yetkazish</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9AA1B2">1 kr</span></li>
<li style="display: flex; justify-content: space-between"><span>Ilova uchun toʻliq spek</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9AA1B2">2 kr</span></li>
<li style="display: flex; justify-content: space-between"><span>Limitdan tashqari prompt</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #9AA1B2">1 kr</span></li>
</ul>
<div role="group" aria-label="Paket" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 6px">
<sc-for list="{{packs}}" as="p" hint-placeholder-count="2">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="position: relative; min-height: 96px; padding: 12px 14px; border: 1px solid; border-radius: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; {{p.style}}">
<sc-if value="{{p.best}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -10px; right: 10px; height: 20px; padding: 0 8px; border-radius: 999px; background: #EDEEF2; color: #0B0C10; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center">Foydaliroq</span></sc-if>
<span style="font-size: 22px; font-weight: 800">{{p.credits}} <span style="font-size: 13px; font-weight: 600; color: #9AA1B2">kredit</span></span>
<span style="font-size: 14px; font-weight: 700">{{p.price}} soʻm</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #9AA1B2">≈ {{p.unit}} soʻm / kr</span>
</button>
</sc-for>
</div>
<div role="group" aria-label="Toʻlov usuli" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{toClick}}" aria-pressed="{{isClick}}" style="height: 46px; border: 1px solid; border-radius: 12px; font-size: 15px; font-weight: 800; {{clickStyle}}">Click</button>
<button type="button" onClick="{{toPayme}}" aria-pressed="{{isPayme}}" style="height: 46px; border: 1px solid; border-radius: 12px; font-size: 15px; font-weight: 800; {{paymeStyle}}">Payme</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<button type="button" style="height: 52px; border-radius: 14px; background: #3A63F0; color: #FFFFFF; font-size: 16px; font-weight: 700">{{payLabel}}</button>
<span style="text-align: center; font-size: 12px; color: #7A8294">Bir martalik · Obuna emas</span>
</div>
<button type="button" style="align-self: center; height: 36px; padding: 0 10px; font-size: 13px; font-weight: 600; color: #9AA1B2; text-decoration: underline; text-underline-offset: 3px">Avval bepul sinab koʻrish · 3 ta qoldi</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var pack = s.pack || 'big';
    var method = s.method || 'click';
    var ON = 'background:rgba(58,99,240,.16);border-color:#4C7DFF;color:#EDEEF2;';
    var OFF = 'background:#171A21;border-color:#262A35;color:#EDEEF2;';
    var list = [
      { id: 'small', credits: 40, price: '15 000', unit: '375', best: false },
      { id: 'big', credits: 120, price: '35 000', unit: '292', best: true }
    ];
    var cur = list.filter(function (p) { return p.id === pack; })[0];
    return {
      packs: list.map(function (p) {
        return { credits: p.credits, price: p.price, unit: p.unit, best: p.best, on: p.id === pack, style: p.id === pack ? ON : OFF, pick: function () { self.setState({ pack: p.id }); } };
      }),
      isClick: method === 'click', isPayme: method === 'payme',
      clickStyle: method === 'click' ? ON : OFF, paymeStyle: method === 'payme' ? ON : OFF,
      toClick: function () { self.setState({ method: 'click' }); },
      toPayme: function () { self.setState({ method: 'payme' }); },
      payLabel: cur.price + ' soʻm toʻlash'
    };
  }
}
</script>
</body>
</html>
